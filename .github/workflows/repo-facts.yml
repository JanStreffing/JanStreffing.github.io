name: Update repository facts

# Writes data/repos.json (stars, last push) for the software cards so the
# page does not depend on the anonymous GitHub API rate limit.

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Collect facts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data
          repos=$(grep -o 'class="card sw" href="https://github.com/[^"/]*/[^"/]*"' index.html \
                  | sed -E 's#.*href="https://github.com/([^"]+)"#\1#' | sort -u)
          echo "{" > data/repos.json
          first=1
          for r in $repos; do
            json=$(gh api "repos/$r" --jq '{stars: .stargazers_count, pushed_at: .pushed_at}' 2>/dev/null) || continue
            mine=$(gh api --paginate "repos/$r/contributors?per_page=100" --jq '[.[] | select(.login=="JanStreffing") | .contributions] | add // 0' 2>/dev/null | paste -sd+ - | bc)
            json=$(printf '%s' "$json" | sed "s/}$/, \"commits\": ${mine:-0}}/")
            [ $first -eq 1 ] || echo "," >> data/repos.json
            first=0
            printf '  "%s": %s' "$r" "$json" >> data/repos.json
          done
          printf '\n}\n' >> data/repos.json
          python3 -m json.tool data/repos.json > /dev/null

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/repos.json
          git diff --cached --quiet && exit 0
          git commit -m "Update repository facts"
          git push
